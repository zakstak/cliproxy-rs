[package]
name = "cliproxy"
description = "Use DeepSeek, GLM, Kimi, OpenRouter and more in Codex CLI and Claude Code: one local endpoint with API translation and failover. CLIProxyAPI-compatible."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["llm", "proxy", "openai", "claude-code", "codex"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]

[dependencies]
cliproxy-internal.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
getrandom = "0.3"
libc.workspace = true
# The -tui management client: the crossterm backend only.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
socket2.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util = "0.7"
futures-util.workspace = true
# Already in the tree through axum and the internal library; the heap-trim response hook.
http-body = "1"
tower = { version = "0.5", features = ["util"] }
# Already in the tree through the internal library; the TUI client follows redirects itself.
url = "2"
# The TUI's management API client.
wreq.workspace = true

[dev-dependencies]
cliproxy-internal = { workspace = true, features = ["test-support"] }
