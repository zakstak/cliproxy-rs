[package]
name = "cliproxy-internal"
description = "Internal implementation of the cliproxy application"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
media-relay = ["dep:webrtc", "dep:rtc", "dep:async-trait"]
pprof = ["dep:pprof", "dep:backtrace"]
# Local protocol peers and fixtures for integration tests and the login harness.
test-support = []

[dependencies]
anyhow = { workspace = true }
async-compression = { version = "0.4", features = ["brotli", "deflate", "gzip", "tokio", "zlib", "zstd"] }
async-trait = { version = "0.1", optional = true }
axum = { workspace = true, features = ["ws"] }
backtrace = { version = "0.3", optional = true }
base64 = { version = "0.22" }
bcrypt = { version = "0.19" }
btls = { version = "0.5.6" }
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = { version = "1" }
futures-util = { workspace = true }
getrandom = { version = "0.3" }
http = { workspace = true }
http-body = { version = "1" }
httpdate = { version = "1" }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = { workspace = true }
memchr = { version = "2" }
pprof = { version = "0.15", default-features = false, features = ["protobuf-codec"], optional = true }
rand = { version = "0.9" }
regex = { version = "1" }
rtc = { version = "0.21", default-features = false, features = ["crypto-ring"], optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
ryu = { version = "1.0.23" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng = { workspace = true }
sha2 = { version = "0.10" }
socket2 = { workspace = true }
subtle = { version = "2.6" }
tiktoken-rs = { version = "0.7" }
tokio = { workspace = true }
tokio-btls = { version = "0.5.6" }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-chrono-0_4"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util"] }
tower-service = { version = "0.3" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unsafe-libyaml = { version = "0.2.11" }
url = { version = "2" }
uuid = { version = "1", features = ["v4", "v5"] }
webrtc = { version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-ring"], optional = true }
wreq = { workspace = true, features = ["socks", "ws"] }
yaml-edit = { version = "0.3.2" }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
http2 = "=0.5.20"
tokio = { workspace = true, features = ["test-util"] }
cliproxy-internal = { path = ".", features = ["test-support"] }
