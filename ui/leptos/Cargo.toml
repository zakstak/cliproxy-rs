[workspace]
resolver = "3"
members = ["app", "model", "sandbox"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
ledger-model = { path = "model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
