# A published release of this fork gets the Linux login-service smoke tests, by hand. The candidate binary
# exercises local checksummed releases, no-op checks, upgrades, rollback and the
# embedded dashboard files without waiting for the next release. This fork supports
# Linux only, so install.sh refuses other systems and there is no install.ps1.
name: Installers

on:
  push:
    branches: [master]
    paths: [install.sh, .github/workflows/install.yml, .github/scripts/test-installers.py, .github/scripts/installer-fixture.rs, .github/scripts/apt-install.sh, crates/cliproxy/**, crates/cpa-server/src/logging.rs, crates/cpa-server/build.rs, crates/cpa-server/src/management.rs, ui/dist/**]
  pull_request:
    paths: [install.sh, .github/workflows/install.yml, .github/scripts/test-installers.py, .github/scripts/installer-fixture.rs, .github/scripts/apt-install.sh, crates/cliproxy/**, crates/cpa-server/src/logging.rs, crates/cpa-server/build.rs, crates/cpa-server/src/management.rs, ui/dist/**]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install, such as v0.1.0, or latest
        default: latest

permissions:
  contents: read

# Pushes to master and pull requests, not both for the same commit; grouped per pull
# request so a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLIPROXY_NO_OPEN: "1"
  VERSION: ${{ inputs.version || 'latest' }}

jobs:
  # Installs a published release of this fork. The fork has published none yet, so this
  # job runs only by hand; the candidate job below needs no release.
  unix:
    name: install.sh (Linux, published release)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install, as curl | sh does
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          sh -s < install.sh
      - name: The server outlived the installer and answers with the generated keys
        run: |
          # shellcheck source=/dev/null
          . ~/.cliproxy-rs/keys.env
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$CLIPROXY_PORT" = 8317
          test "$(find ~/.cliproxy-rs/keys.env ~/.cliproxy-rs/config.yaml -perm 600 | wc -l)" -eq 2
          test "$(code http://127.0.0.1:8317/healthz)" = 200
          test "$(code -H "Authorization: Bearer $CLIPROXY_CLIENT_KEY" http://127.0.0.1:8317/v1/models)" = 200
          test "$(code http://127.0.0.1:8317/v1/models)" = 401
          test "$(code -H "Authorization: Bearer $CLIPROXY_MANAGEMENT_KEY" http://127.0.0.1:8317/v8/management/config)" = 200
          test "$(code http://127.0.0.1:8317/management.html)" = 200
      - name: A current rerun keeps config, keys and the running server
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          before=$(cksum ~/.cliproxy-rs/config.yaml ~/.cliproxy-rs/keys.env)
          old=$(cat ~/.cliproxy-rs/cliproxy.pid)
          sh install.sh
          test "$(cksum ~/.cliproxy-rs/config.yaml ~/.cliproxy-rs/keys.env)" = "$before"
          sh install.sh --check
          test "$(cat ~/.cliproxy-rs/cliproxy.pid)" = "$old"
          kill -0 "$old"
          curl -fsS http://127.0.0.1:8317/healthz
      - name: A second install moves to the next free port
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          CLIPROXY_HOME="$RUNNER_TEMP/second" sh install.sh
          grep -qx CLIPROXY_PORT=8318 "$RUNNER_TEMP/second/keys.env"
          curl -fsS http://127.0.0.1:8318/healthz
          curl -fsS http://127.0.0.1:8317/healthz
          kill "$(cat "$RUNNER_TEMP/second/cliproxy.pid")"
      - name: Start at login (systemd user unit)
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          sh install.sh --service
          test ! -e ~/.cliproxy-rs/cliproxy.pid
          test "$(systemctl --user is-enabled cliproxy)$(systemctl --user is-active cliproxy)" = enabledactive
          curl -fsS http://127.0.0.1:8317/healthz
          sh install.sh
          test "$(systemctl --user is-active cliproxy)" = active
          systemctl --user disable --now cliproxy
      - name: Diagnostics
        if: failure()
        run: |
          for h in ~/.cliproxy-rs "$RUNNER_TEMP/second"; do
            [ -d "$h" ] || continue
            echo "== $h"
            if [ -f "$h/cliproxy.pid" ]; then
              pid=$(cat "$h/cliproxy.pid")
              echo "pid file: $pid"
              ps -p "$pid" -o pid=,ppid=,comm=,args= || echo "process $pid is not running"
            else
              echo "no pid file"
            fi
            tail -n 40 "$h/cliproxy.log" || echo "no cliproxy.log"
          done
          ss -ltnp 2>/dev/null | grep -E ':83[0-9]{2}' || echo "nothing listens on 8300-8399"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user status cliproxy --no-pager || true

  candidate:
    name: Local upgrade paths (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build tools
        run: .github/scripts/apt-install.sh cmake clang libclang-dev perl
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Saved from master only, as in ci.yml: each pull request saving its own 1.2 GB of
      # caches pushed master's caches out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the candidate, not a release lacking --log-file
        run: cargo build --locked -p cliproxy
      - name: Build the local release fixture before network isolation
        run: |
          mkdir -p target/installer-fixtures
          rustc .github/scripts/installer-fixture.rs -o target/installer-fixtures/hanging
      - name: Installer tests with external network denied
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" unshare --net -- sh -c 'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --init-groups -- python3 .github/scripts/test-installers.py target/debug/cliproxy' sh "$(id -u)" "$(id -g)"
