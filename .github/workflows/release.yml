# Builds Linux release archives, a SHA256SUMS file and the single-file dashboard
# (management.html) for Go CLIProxyAPI servers. This fork builds no native Windows or
# macOS binaries; those hosts run the Linux container (docs/INSTALL.md#docker).
#
# Pushing a tag such as v0.1.0 creates a draft GitHub release with every asset attached;
# a maintainer reviews and publishes it. A manual run builds the same files as workflow
# artifacts without creating a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # One exact compiler for every job: the size and allocation budgets are exact numbers
  # from one compiler and std. Bumping it means re-measuring bench/budgets.txt.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check, test and build
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      # The binary embeds the committed ui/dist, so it must be what the source builds.
      - name: Committed build matches the source
        run: git diff --exit-code -- ui/dist ui/dist-panel ui/PANEL.md
      - uses: actions/upload-artifact@v7
        with:
          name: panel
          path: ui/dist-panel/management.html
          if-no-files-found: error

  # The same fmt, clippy and network-denied tests as every push.
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: [dashboard, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 so the binaries need glibc 2.35 at most.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev perl
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: |
          cargo tree --locked -p cliproxy --target ${{ matrix.target }} --edges normal --prefix none > release-dependencies.txt
          if grep -qE '^(pprof|backtrace) v' release-dependencies.txt; then
            echo '::error::Published release binaries must exclude CPU profiling and symbol resolution'
            exit 1
          fi
          cargo build --release --locked -p cliproxy --target ${{ matrix.target }}
      - name: Package
        run: |
          tagged=false; [[ "$GITHUB_REF" == refs/tags/v* ]] && tagged=true
          if $tagged; then version="${GITHUB_REF_NAME#v}"; else version="dev-${GITHUB_SHA::7}"; fi
          name="cliproxy-${version}-${{ matrix.target }}"
          mkdir -p "$name" out
          cp "target/${{ matrix.target }}/release/cliproxy" README.md LICENSE "$name/"
          # The first line is Go's startup banner; the last is "cliproxy <version>".
          reported="$("./$name/cliproxy" --version | tail -n 1)"
          echo "$reported"
          if $tagged && [[ "$reported" != "cliproxy $version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the binary version ($reported)"; exit 1
          fi
          tar -czf "out/$name.tar.gz" "$name"
          ls -l out
          bench/gate.sh size "${{ matrix.target }}" "$name/cliproxy" out/"$name".tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  docker:
    name: docker image (not pushed)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t cliproxy-rs:ci .
      - name: Smoke test
        run: docker run --rm cliproxy-rs:ci --version
      - name: Size gate
        run: bench/gate.sh image cliproxy-rs:ci

  release:
    name: draft release
    needs: [build, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft
