# Idle cost outside the per-PR Linux gate: once a week, by hand, and on a push to master
# or a pull request that changes the file watcher or these gates. This fork builds for
# Linux only, so there are no macOS or Windows idle gates.
#
# - Go comparison: CLIProxyAPI's release binary and this one on the same one-API-key
#   config in a loopback-only network, 30 s of warm-up, then 300 s of samples. No OAuth
#   credentials are involved, so nothing can be signed out. The numbers go to the job
#   summary and an artifact; they are reported, not gated.
# One run per change: pushes to master, and pull requests through `pull_request` only. A
# branch push used to start a second run of every job for the same commit. Runs are
# grouped per pull request (or per ref outside one), and a newer push cancels the older
# run.
name: idle

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - crates/cpa-server/src/fs_events.rs
      - crates/cpa-server/src/watching.rs
      - bench/idle.sh
      - bench/gate.sh
      - bench/budgets.txt
      - .github/workflows/idle.yml
      - .github/scripts/apt-install.sh
  pull_request:
    paths:
      - crates/cpa-server/src/fs_events.rs
      - crates/cpa-server/src/watching.rs
      - bench/idle.sh
      - bench/gate.sh
      - bench/budgets.txt
      - .github/workflows/idle.yml
      - .github/scripts/apt-install.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # One exact compiler for every job: the size and allocation budgets are exact numbers
  # from one compiler and std. Bumping it means re-measuring bench/budgets.txt.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: "0"

jobs:
  go-comparison:
    name: idle, Go vs cliproxy-rs (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GO_RELEASE: v8.0.10
      GO_ARCHIVE: CLIProxyAPI_8.0.10_linux_amd64.tar.gz
      GO_SHA256: 6211e059951e83acffedac098ad44a8bc60b47a53988c8d34d44397bfabbf578
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: .github/scripts/apt-install.sh cmake clang libclang-dev perl
      - name: Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --release --locked -p cliproxy
      - name: CLIProxyAPI release binary
        run: |
          curl -sSfL -o go.tar.gz "https://github.com/router-for-me/CLIProxyAPI/releases/download/$GO_RELEASE/$GO_ARCHIVE"
          echo "$GO_SHA256  go.tar.gz" | sha256sum -c -
          mkdir go-bin && tar -xzf go.tar.gz -C go-bin
      - name: Compare
        run: |
          for server in go rust; do
            bin=target/release/cliproxy; [[ $server == go ]] && bin=go-bin/cli-proxy-api
            WARMUP=30 bench/idle.sh "$bin" 0 300 2> "idle-$server.threads" | jq -c --arg s "$server" '. + {server: $s}' | tee -a idle-compare.jsonl
          done
          {
            echo "### Idle, Go $GO_RELEASE vs cliproxy-rs, 300 s after 30 s of warm-up"
            echo
            echo "| Server | Wakeups per minute | CPU ms per hour | Threads | RSS (MB) |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '"| \(.server) | \(.wakeups / (.seconds / 60) | . * 10 | round / 10) | \(.cpu_ticks * 10 * 3600 / .seconds | round) | \(.threads) | \(.rss_kb / 1024 | . * 10 | round / 10) |"' idle-compare.jsonl
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: idle-compare
          path: |
            idle-compare.jsonl
            idle-*.threads
